name: Compilar APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Descomprimir proyecto Android
        run: |
          unzip -o MascotaAndroid_v0.1.zip
          ls -la
          ls -la MascotaAndroid

      - name: Compilar APK
        working-directory: MascotaAndroid
        run: gradle assembleDebug --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: MiMascota-debug
          path: MascotaAndroid/app/build/outputs/apk/debug/app-debug.apk
